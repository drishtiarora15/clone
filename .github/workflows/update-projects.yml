name: Update projects from Behance

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:
    inputs:
      extra_urls:
        description: "Optional: Behance project URLs to add right now (space separated)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Look for new Behance projects
        env:
          BEHANCE_USERNAME: drishtiarora8
          EXTRA_URLS: ${{ github.event.inputs.extra_urls }}
        run: node scripts/update-projects.mjs

      - name: Commit projects.json if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain projects.json)" ]; then
            echo "No new projects."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "chore: sync new Behance projects"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 \
            && echo "Requested a GitHub Pages rebuild." \
            || echo "Skipped Pages rebuild (not using Pages 'Deploy from a branch')."
